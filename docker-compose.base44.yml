# Base44 sandbox environment for this repository.
#
# The app is a Vite + React single-page frontend (Agri Connect Emfuleni). All
# screens, routing and sign-in are client side; entity data and hosted auth are
# served by the Base44 backend through the SDK. This compose file runs the
# frontend dev server from the cloned source, so every edit hot-reloads.
services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        if [ ! -f node_modules/.base44-installed ] || [ package-lock.json -nt node_modules/.base44-installed ]; then
          npm ci --no-audit --no-fund
          touch node_modules/.base44-installed
        fi
        exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort
    env_file:
      # Platform-delivered secrets (Base44 app id + backend URL). Last so it wins.
      - /run/base44/app.env
    ports:
      - "3000:3000"
    environment:
      # Platform-provided preview flags/hosts (bare entries pass the value through).
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts so the preview proxy host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Used by the app when it builds hosted-backend URLs.
      - BASE44_PUBLIC_HOST_SUFFIX
    volumes:
      - .:/app
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
